[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Chapter 29: seven-ring RAG pipeline from scratch (parse/clean/chunk/metadata/index/retrieve/generate + layered trace)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag_pipeline"
