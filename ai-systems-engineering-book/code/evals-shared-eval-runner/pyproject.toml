[project]
name = "eval-runner"
version = "0.1.0"
description = "Shared evaluation runner for all book projects (datasets, metrics, reproducible runs)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["uv_build>=0.7"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.build-backend]
module-name = "eval_runner"
