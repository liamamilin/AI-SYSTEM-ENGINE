[project]
name = "ai-backend"
version = "0.1.0"
description = "Chapter 33: AI backend reference architecture — seven components, Job dispatch, degradation matrix"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_backend"
