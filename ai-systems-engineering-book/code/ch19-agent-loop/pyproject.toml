[project]
name = "agent-loop"
version = "0.1.0"
description = "Chapter 19: agent loop from scratch (model + loop + tools + state)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_loop"
