[project]
name = "model-gateway"
version = "0.1.0"
description = "Chapter 11: model gateway with provider abstraction, routing, fallback, reliability"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "openai>=1.40",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["uv_build>=0.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "model_gateway"

[tool.pytest.ini_options]
asyncio_mode = "auto"
