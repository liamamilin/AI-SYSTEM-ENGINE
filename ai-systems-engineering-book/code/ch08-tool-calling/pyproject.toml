[project]
name = "tool-calling-demo"
version = "0.1.0"
description = "Chapter 8: tool calling loop (model proposes, host executes)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["uv_build>=0.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tool_calling"

[tool.pytest.ini_options]
asyncio_mode = "auto"
